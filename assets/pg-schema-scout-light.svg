<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">pg-schema-scout</title>
<desc id="desc">MCP server. 6.0x less schema context than a full dump: 1,816 tokens against 10,927. 12 of 12 unsafe queries blocked, 9 of 9 safe queries allowed.</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1F6FEB"/><stop offset="1" stop-color="#0891B2"/>
  </linearGradient>
  <radialGradient id="glow" cx="1100" cy="40" r="520" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.070"/>
    <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="card"><rect x="0.5" y="0.5" width="1199" height="335" rx="20"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="336" fill="#FFFFFF"/>
  <rect width="1200" height="336" fill="url(#glow)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="335" rx="20" fill="none" stroke="#D0D7DE"/>

<text x="48" y="64" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.5" fill="#1F6FEB">OPEN SOURCE · MCP SERVER</text>
<text x="46" y="114" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="36" font-weight="700" fill="#0D1117">pg-schema-scout</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" fill="#0D1117">
  <tspan x="48" y="160">Schema access for an agent is a</tspan>
  <tspan x="48" y="186">retrieval problem, not a dump.</tspan>
</text>
<text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#57606A">
  <tspan x="48" y="226">Hands the model only the tables relevant to its question.</tspan>
  <tspan x="48" y="248">Read-only enforced in three layers: SQL AST policy,</tspan>
  <tspan x="48" y="270">a SELECT-only role, statement timeouts.</tspan>
</text>
<text x="48" y="304" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#1F6FEB">Python · MIT · github.com/akshayyswami/pg-schema-scout →</text>

<line x1="560" y1="40" x2="560" y2="296" stroke="#D0D7DE"/>
<text x="600" y="50" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.2" fill="#57606A">SCHEMA TOKENS PER QUESTION · ADVENTUREWORKS, 68 TABLES</text>

<text x="600" y="82" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#57606A">full dump</text>
<rect x="600" y="92" width="470" height="20" rx="6" fill="#D0D7DE" fill-opacity="0.35"/>
<rect x="600" y="92" width="0" height="20" rx="6" fill="#57606A">
  <animate attributeName="width" from="0" to="470.0" dur="1.1s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
</rect>
<text x="1084" y="107" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#0D1117">10,927</text>

<text x="600" y="140" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#57606A">retrieved slice, mean of 26 questions</text>
<rect x="600" y="150" width="470" height="20" rx="6" fill="#D0D7DE" fill-opacity="0.35"/>
<rect x="600" y="150" width="0" height="20" rx="6" fill="url(#acc)">
  <animate attributeName="width" from="0" to="78.1" dur="1.1s" begin="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
</rect>
<text x="1084" y="165" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#0D1117">1,816</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/><text x="600" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="url(#acc)">6.0x</text><text x="600" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">less schema context</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/><text x="790" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="url(#acc)">12/12</text><text x="790" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">unsafe queries blocked</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/><text x="980" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="url(#acc)">9/9</text><text x="980" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#57606A">safe queries allowed</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
